name: Deploy EC2 via CloudFormation

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true   # <-- FIX: Prevents passing the 7 session tags

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: StudentDayEC2Stack
          template: template.yaml
          no-fail-on-empty-changeset: "1"
          parameter-overrides: >-
            GitHubRepoUrl=https://github.com/${{ github.repository }}.git